<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robert Capron</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #06060e; overflow: hidden; }
    canvas { position: fixed; top: 0; left: 0; display: block; cursor: grab; }
    canvas.dragging { cursor: grabbing; }
    #ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

    /* ── BACKGROUND FX — subtle scanline drift + vignette over the WebGL scene ── */
    #bg-fx { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    #bg-fx::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
    }
    #bg-fx::after {
      content: ''; position: absolute; inset: -2px;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px,
        transparent 1px, transparent 3px
      );
      mix-blend-mode: overlay; opacity: 0.35;
      animation: scanDrift 11s linear infinite;
    }
    @keyframes scanDrift {
      0%   { transform: translateY(0); }
      100% { transform: translateY(300px); }
    }
    /* ── NAV BARS ── */
    #topnav, #bottomnav {
      position: fixed; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; padding: 0 28px;
      background: rgba(6,6,14,0.62);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    #topnav {
      top: 0; height: 54px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 1px 0 0 rgba(120,170,255,0.18);
    }
    #bottomnav {
      bottom: 0; height: 42px;
      border-top: 1px solid rgba(255,255,255,0.06);
      justify-content: center; gap: 12px;
    }

    /* RC logo mark */
    #logo {
      display: flex; align-items: baseline; gap: 8px;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: 19px; letter-spacing: 6px; text-transform: uppercase;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 0 28px rgba(100,160,255,0.4);
      cursor: default; user-select: none; line-height: 1;
      min-width: 2ch; /* reserve space so the decode-in doesn't jump */
    }
    #logo .wip-tag {
      font-family: 'Space Mono', monospace; font-size: 8px;
      letter-spacing: 2px; text-transform: uppercase; font-weight: 400;
      color: rgba(255,180,80,0.75); border: 1px solid rgba(255,180,80,0.3);
      border-radius: 3px; padding: 3px 6px;
    }

    /* nav links + sound btn */
    #nav-right {
      margin-left: auto; display: flex; align-items: center; gap: 32px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.4); text-decoration: none;
      background: none; border: none; padding: 0; cursor: pointer;
      transition: color 0.2s;
    }
    .nav-link .nl-idx { color: rgba(120,170,255,0.75); font-size: 8px; }
    .nav-link:hover { color: rgba(255,255,255,0.95); }

    #sound-btn {
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 3px; text-transform: uppercase;
      background: none; border: 1px solid rgba(255,255,255,0.14);
      border-radius: 3px; padding: 5px 8px; cursor: pointer;
      color: rgba(120,170,255,0.85); opacity: 0.75;
      transition: opacity 0.2s, border-color 0.2s;
    }
    #sound-btn:hover { opacity: 1; border-color: rgba(120,170,255,0.4); }
    #sound-btn.muted { color: rgba(255,255,255,0.3); opacity: 0.45; }

    /* shared glitch-flicker — same effect used on the case-study title */
    .glitch-flicker { animation: csGlitch 0.4s steps(2,end); }

    /* bottom hint */
    #bottomnav span {
      display: flex; align-items: center; gap: 12px;
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.14);
    }
    #bottomnav span::before, #bottomnav span::after {
      content: ''; width: 20px; height: 1px; background: rgba(120,170,255,0.25);
    }

    /* ── CASE STUDY REVEAL (in-page, not a modal) ── */
    /* Locked at top by default; unlocked only while a marble is open */
    body.expanded { overflow-y: auto; }

    /* pointer-events:none so the transparent spacer never steals clicks meant for
       the hero canvas beneath it; .case-panel opts back in for its own content */
    #case-content { position: relative; z-index: 5; pointer-events: none; }
    .case-spacer { height: 100vh; } /* lets the hero canvas show through untouched */
    .case-panel {
      position: relative; pointer-events: auto;
      background: linear-gradient(180deg, rgba(6,6,14,0) 0%, #06060e 160px, #06060e 100%);
    }
    .case-inner {
      position: relative;
      max-width: 920px; margin: 0 auto;
      padding: 40px 32px 180px;
      opacity: 0; transform: translateY(26px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    body.expanded .case-inner { opacity: 1; transform: translateY(0); }

    /* huge faint index numeral sitting behind the title */
    #cs-index {
      position: absolute; top: -0.32em; left: 32px; z-index: 0;
      font-family: 'Space Mono', monospace; font-weight: 700;
      font-size: clamp(90px, 20vw, 260px); line-height: 1;
      color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.08);
      user-select: none; pointer-events: none;
    }
    #cs-category {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 12px;
      font-family: 'Space Mono', monospace; font-size: 11px;
      letter-spacing: 6px; text-transform: uppercase;
      color: rgba(120,170,255,0.95); margin-bottom: 8px;
      min-height: 1.2em; /* reserve space so scramble doesn't jump */
    }
    #cs-category::before { content:''; width: 26px; height: 1px; background: rgba(120,170,255,0.6); }
    #cs-title {
      position: relative; z-index: 1;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
      font-size: clamp(52px, 9vw, 128px); line-height: 0.9;
      letter-spacing: -0.03em; text-transform: uppercase;
      color: rgba(255,255,255,0.97); margin-bottom: 34px;
      min-height: 1em;
    }
    @keyframes csGlitch {
      0%   { text-shadow: none; transform: translateX(0); }
      15%  { text-shadow: -3px 0 rgba(255,60,90,0.75), 3px 0 rgba(60,190,255,0.75); transform: translateX(-2px); }
      30%  { text-shadow: 3px 0 rgba(255,60,90,0.75), -3px 0 rgba(60,190,255,0.75); transform: translateX(2px); }
      45%  { text-shadow: -2px 0 rgba(255,60,90,0.6), 2px 0 rgba(60,190,255,0.6); transform: translateX(0); }
      60%  { text-shadow: none; transform: translateX(0); }
      100% { text-shadow: none; transform: translateX(0); }
    }
    #cs-desc {
      position: relative; z-index: 1;
      font-family: 'Space Mono', monospace; font-weight: 400;
      font-size: 14px; line-height: 1.85; color: rgba(255,255,255,0.5);
      max-width: 58ch; padding-left: 20px;
      border-left: 2px solid rgba(120,170,255,0.35);
    }
    #cs-placeholder-tag {
      position: relative; z-index: 1;
      display: inline-block; margin-top: 28px;
      font-family: 'Space Mono', monospace; font-size: 9px;
      letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,180,80,0.7); border: 1px solid rgba(255,180,80,0.25);
      border-radius: 4px; padding: 5px 9px;
    }

    #back-btn {
      position: fixed; bottom: 26px; right: 26px; z-index: 150;
      font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; color: rgba(255,255,255,0.7);
      background: rgba(10,10,20,0.7); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px; padding: 12px 18px; cursor: pointer;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.14); }
    body.expanded #back-btn { opacity: 1; pointer-events: auto; transform: translateY(0); }

    #bottomnav { transition: opacity 0.3s ease; }
    body.expanded #bottomnav { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <!-- TOP NAV -->
  <nav id="topnav">
    <div id="logo"><span id="logo-mark">RC</span><span class="wip-tag">// wip</span></div>
    <div id="nav-right">
      <a class="nav-link" href="about.html"><span class="nl-idx">01</span>About</a>
      <a class="nav-link" href="contact.html"><span class="nl-idx">02</span>Contact</a>
      <button id="sound-btn" title="Toggle sound">[ SND ON ]</button>
    </div>
  </nav>

  <!-- 3-D LABELS -->
  <div id="ui"></div>

  <!-- BACKGROUND FX -->
  <div id="bg-fx"></div>

  <!-- BOTTOM NAV -->
  <nav id="bottomnav">
    <span>drag to orbit &nbsp;·&nbsp; hover to explore &nbsp;·&nbsp; click to open</span>
  </nav>

  <!-- CASE STUDY REVEAL — in-page section below the hero, not a popup -->
  <section id="case-content">
    <div class="case-spacer"></div>
    <div class="case-panel">
      <div class="case-inner">
        <div id="cs-index"></div>
        <div id="cs-category"></div>
        <h1 id="cs-title"></h1>
        <p id="cs-desc"></p>
        <span id="cs-placeholder-tag">placeholder — real copy pending</span>
      </div>
    </div>
  </section>
  <button id="back-btn">↑ back to marbles</button>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ── RENDERER ──────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.0)); // hard cap at 1× — biggest single GPU win
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    document.body.insertBefore(renderer.domElement, document.getElementById('ui'));

    const scene  = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 200);
    camera.position.set(0, 1, 4.8);
    camera.lookAt(0, 0, 0);

    // ── STARS ─────────────────────────────────────────────────────
    {
      const n = 300, pos = new Float32Array(n*3);
      for (let i = 0; i < n*3; i++) pos[i] = (Math.random()-.5)*150;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({
        color: 0xffffff, size: 0.07, sizeAttenuation: true, transparent: true, opacity: 0.4,
      })));
    }


    // ── LIGHTS ────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x334466, 3));
    const keyLight = new THREE.DirectionalLight(0xffffff, 5);
    keyLight.position.set(5, 8, 6);
    scene.add(keyLight);
    // Two fixed coloured fills — no per-frame orbit math
    const fillA = new THREE.PointLight(0x4488ff, 3, 12);
    fillA.position.set(-4, 3, 3); scene.add(fillA);
    const fillB = new THREE.PointLight(0xff44aa, 3, 12);
    fillB.position.set( 4,-2, 3); scene.add(fillB);
    const rimLights = []; // empty — no per-frame light animation

    // ── PROCEDURAL ENVIRONMENT MAP — for physically-based glass reflections ──
    // Generated in-browser (tiny canvas gradient, ~0 bytes over the wire) rather
    // than downloading an HDRI, then baked to a PMREM once at load. This is what
    // makes the marbles' glass shell reflect/refract like real glass instead of
    // the old flat-opacity fake, with no extra network cost.
    {
      const c = document.createElement('canvas');
      c.width = 16; c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0.00, '#7fa8ff');
      g.addColorStop(0.18, '#3a5cc0');
      g.addColorStop(0.42, '#131a3a');
      g.addColorStop(0.60, '#05050f');
      g.addColorStop(0.82, '#1a0f2a');
      g.addColorStop(1.00, '#ff6fae');
      ctx.fillStyle = g; ctx.fillRect(0, 0, 16, 256);
      // two thin bright "window" streaks so the glass catches distinct highlights
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(0, 40, 16, 4);
      ctx.fillStyle = 'rgba(160,200,255,0.8)'; ctx.fillRect(0, 150, 16, 3);

      const gradTex = new THREE.CanvasTexture(c);
      gradTex.mapping = THREE.EquirectangularReflectionMapping;
      gradTex.colorSpace = THREE.SRGBColorSpace;
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromEquirectangular(gradTex).texture;
      pmrem.dispose();
      gradTex.dispose();
    }

    // ── INNER SPHERE — FBM DOMAIN-WARPED SWIRL SHADER ─────────────
    // Matches the bold, painterly 2-colour swirls in the reference image
    const swirlVS = `
      varying vec3 vPos;
      varying vec3 vNormal;
      void main() {
        vPos    = position;
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const swirlFS = `
      uniform vec3  uC1;   // primary colour
      uniform vec3  uC2;   // secondary colour
      uniform float uSeed; // per-marble offset
      varying vec3  vPos;
      varying vec3  vNormal;

      // Value noise hash
      float hash(vec3 p) {
        p = fract(p * vec3(443.8975, 397.2973, 491.1871));
        p += dot(p.zxy, p.yxz + 19.19);
        return fract(p.x * p.y * p.z);
      }

      // Smooth value noise
      float vnoise(vec3 p) {
        vec3 i = floor(p), f = fract(p);
        f = f*f*(3.0 - 2.0*f);
        return mix(
          mix(mix(hash(i),               hash(i+vec3(1,0,0)), f.x),
              mix(hash(i+vec3(0,1,0)),   hash(i+vec3(1,1,0)), f.x), f.y),
          mix(mix(hash(i+vec3(0,0,1)),   hash(i+vec3(1,0,1)), f.x),
              mix(hash(i+vec3(0,1,1)),   hash(i+vec3(1,1,1)), f.x), f.y), f.z);
      }

      // 2-octave fBm (cheaper — was 3)
      float fbm(vec3 p) {
        float v=0.0, a=0.5;
        for (int i=0; i<2; i++) {
          v += a * vnoise(p);
          p  = p * 2.2 + vec3(1.7, 9.2, 5.8);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec3 p = vPos * 2.4 + uSeed;

        // Single-level domain warp (was 2 levels — halves shader cost)
        float q = fbm(p);
        float f = fbm(p + vec3(q*2.2, q*1.6, q*0.9));

        // Broad bands between the two colours (bold, like the reference)
        float t = smoothstep(0.28, 0.72, f);

        // Thin accent veins running through the swirl
        float vein = pow(max(0.0, sin(f * 12.566)), 6.0) * 0.28;

        vec3 col = mix(uC1, uC2, clamp(t + vein, 0.0, 1.0));

        // Diffuse shading so the sphere reads as 3D
        float diff = max(dot(vNormal, normalize(vec3(0.5, 1.0, 0.8))), 0.0) * 0.55 + 0.45;
        col = col * diff + mix(uC1, uC2, 0.5) * 0.45;

        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }
    `;



    // ── RGB BEAM TRAIL — camera-facing ribbon mesh ───────────────
    // Ring-buffer of world-space positions (oldest=0, newest=TRAIL_N-1)
    const TRAIL_N    = 48;
    const BEAM_HW    = 0.020;                          // half-width at head (world units)
    const trailPosArr = new Float32Array(TRAIL_N * 3); // initialised at 0,0,0
    let   trailSeeded = false;

    // Ribbon: 2 edge verts per trail point, quads between consecutive pairs
    const ribPosArr = new Float32Array(TRAIL_N * 2 * 3);
    const ribColArr = new Float32Array(TRAIL_N * 2 * 3);
    const ribIdxArr = new Uint16Array((TRAIL_N - 1) * 6);
    for (let i = 0; i < TRAIL_N - 1; i++) {
      const v = i * 2, ii = i * 6;
      ribIdxArr[ii]   = v;   ribIdxArr[ii+1] = v+2; ribIdxArr[ii+2] = v+1;
      ribIdxArr[ii+3] = v+1; ribIdxArr[ii+4] = v+2; ribIdxArr[ii+5] = v+3;
    }
    const ribGeo = new THREE.BufferGeometry();
    ribGeo.setAttribute('position', new THREE.BufferAttribute(ribPosArr, 3));
    ribGeo.setAttribute('color',    new THREE.BufferAttribute(ribColArr, 3));
    ribGeo.setIndex(new THREE.BufferAttribute(ribIdxArr, 1));

    const ribMesh = new THREE.Mesh(ribGeo, new THREE.MeshBasicMaterial({
      vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
      side: THREE.DoubleSide,
    }));
    ribMesh.frustumCulled = false;
    scene.add(ribMesh);

    // Reusable vectors for ribbon orientation
    const _hslCol = new THREE.Color();
    const _seg    = new THREE.Vector3();
    const _perp   = new THREE.Vector3();
    const _camFwd = new THREE.Vector3();
    const _camRt  = new THREE.Vector3();

    // ── TEXTURE LOADER ────────────────────────────────────────────
    const texLoader = new THREE.TextureLoader();
    function loadTex(path, pixelated = false) {
      const t = texLoader.load(path);
      t.minFilter = pixelated ? THREE.NearestFilter : THREE.LinearMipmapLinearFilter;
      t.magFilter = pixelated ? THREE.NearestFilter : THREE.LinearFilter;
      return t;
    }

    // ── CIRCULAR VIGNETTE MASK for sprites ───────────────────────
    // Fades sprite edges to transparent so it looks like a round window
    const maskCvs = document.createElement('canvas');
    maskCvs.width = maskCvs.height = 256;
    const mCtx = maskCvs.getContext('2d');
    const mGrad = mCtx.createRadialGradient(128,128,0, 128,128,128);
    mGrad.addColorStop(0.0,  'white');
    mGrad.addColorStop(0.72, 'white');        // full opacity to 72 % of radius
    mGrad.addColorStop(1.0,  'rgba(0,0,0,0)');// transparent at edge
    mCtx.fillStyle = mGrad;
    mCtx.fillRect(0, 0, 256, 256);
    const spriteMask = new THREE.CanvasTexture(maskCvs);

    // One image per portfolio marble — assigned by visual fit
    const imgTex = {
      'Web Design':  loadTex('MonkeyGorillanation.gif', true),       // pixelated web artifact → keep it crunchy
      'Interactive': loadTex('cat bird.jpg'),                         // warm fantasy painting
      'UX/UI':       loadTex('Creativity.png'),                       // chaotic vibrant illustration
      'Branding':    loadTex('treasure.jpg'),                         // rich illustrated world
      'Graphic':     loadTex('c00e9d8eaa4182dec7504f124be642f8.jpg'), // bold comic art
      'Engineering': loadTex('skeleton.png'),                         // dark + structured
    };

    // ── MARBLE DEFINITIONS ────────────────────────────────────────
    // 4 discrete size steps
    // s1=0.42  s2=0.53  s3=0.64  s4=0.75
    const S = [0, 0.42, 0.53, 0.64, 0.75]; // index = size 1-4

    const PORTFOLIO = [
      { label: 'Web Design',   glass: 0xffffff, c1: 0x00aacc, c2: 0xaadd00, r: S[3] },
      { label: 'Interactive',  glass: 0xffffff, c1: 0xff5500, c2: 0x1155aa, r: S[2] },
      { label: 'UX/UI',        glass: 0xffffff, c1: 0x8833dd, c2: 0xffcc00, r: S[4] },
      { label: 'Branding',     glass: 0xffffff, c1: 0xff8800, c2: 0xcc3300, r: S[3] },
      { label: 'Graphic',      glass: 0xffffff, c1: 0xcc0044, c2: 0xff6600, r: S[3] },
      { label: 'Engineering',  glass: 0xffffff, c1: 0x0044cc, c2: 0x00ccee, r: S[2] },
    ];
    const SMALLS = [
      { glass: 0xffffff, c1: 0xff3300, c2: 0xffaa00, r: S[2] },
      { glass: 0xffffff, c1: 0x00cc88, c2: 0xffee00, r: S[1] },
      { glass: 0xffffff, c1: 0x2200cc, c2: 0xee00ff, r: S[2] },
      { glass: 0xffffff, c1: 0xff0088, c2: 0xff8800, r: S[1] },
      { glass: 0xffffff, c1: 0xffcc00, c2: 0xff4400, r: S[2] },
    ];

    // ── BUILD MARBLE ──────────────────────────────────────────────
    function buildMarble(def, idx, tex = null) {
      const group = new THREE.Group();

      // Outer glass shell — true refraction via `transmission` so light
      // actually bends through the marble, not just a reflective sheen.
      const outer = new THREE.Mesh(
        new THREE.SphereGeometry(def.r, 24, 24),
        new THREE.MeshPhysicalMaterial({
          color:       0xffffff,
          metalness:   0,
          roughness:   0.05,
          transmission: 1,
          thickness:   def.r * 1.6,
          ior:         1.5,
          clearcoat:   0.4,
          clearcoatRoughness: 0.12,
          envMapIntensity: 1.4,
          transparent: true,
          opacity:     1,
          depthWrite:  false,
        })
      );
      group.add(outer);

      // Swirl sphere — coloured backdrop for ALL marbles
      const innerGroup = new THREE.Group();
      const inner = new THREE.Mesh(
        new THREE.SphereGeometry(def.r * 0.82, 28, 28),
        new THREE.ShaderMaterial({
          uniforms: {
            uC1:   { value: new THREE.Color(def.c1) },
            uC2:   { value: new THREE.Color(def.c2) },
            uSeed: { value: idx * 2.618 },
          },
          vertexShader:   swirlVS,
          fragmentShader: swirlFS,
        })
      );
      innerGroup.add(inner);
      group.add(innerGroup);

      // Portfolio marbles: flat image plane sitting just inside the marble's front face.
      // It is repositioned every frame toward the camera so:
      //  - own swirl sphere (slightly behind it) doesn't occlude it
      //  - a far marble's swirl sphere (opaque, writes depth) DOES occlude it correctly
      let imagePlane = null;
      if (tex) {
        imagePlane = new THREE.Mesh(
          new THREE.PlaneGeometry(def.r * 1.55, def.r * 1.55),
          new THREE.MeshBasicMaterial({
            map:        tex,
            alphaMap:   spriteMask,
            transparent: true,
            opacity:    0.72,
            color:      new THREE.Color(0.38, 0.38, 0.38),
            depthWrite: false,
            depthTest:  true,
            side:       THREE.FrontSide,
          })
        );
        group.add(imagePlane);
      }

      scene.add(group);
      return {
        group, innerGroup, outer, inner, imagePlane,
        radius: def.r, isPortfolio: !!def.label,
        label: def.label ?? '',
        c1: def.c1, c2: def.c2,

      };
    }

    const allMarbles = [
      ...PORTFOLIO.map((d,i) => buildMarble(d, i, imgTex[d.label])),

    ];
    const portfolioMarbles = allMarbles.filter(m => m.isPortfolio);

    // ── INIT POSITIONS ────────────────────────────────────────────
    ;(function() {
      const placed = [];

        let p, tries=0;
        do {
          const r=1.6+Math.random()*2.2, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
          p = new THREE.Vector3(r*Math.sin(ph)*Math.cos(th), r*Math.sin(ph)*Math.sin(th), r*Math.cos(ph));
          tries++;

        m.pos.copy(p);

    })();

    const ui = document.getElementById('ui'); // kept for potential future use

    // ── AUDIO ─────────────────────────────────────────────────────
    let audioCtx = null;
    let soundEnabled = true;

    // Sound toggle button
    const soundBtn = document.getElementById('sound-btn');
    soundBtn.addEventListener('click', e => {

    // Nav — small glitch flick on hover, echoing the case-study title effect

      el.addEventListener('mouseenter', () => {

        el.classList.add('glitch-flicker');

    window.addEventListener('mousemove', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      if (audioCtx.state==='suspended') audioCtx.resume();
    }, { once: true });

    function playGlassClink() {
      if (!audioCtx || !soundEnabled) return;
      const now=audioCtx.currentTime, fund=1900+Math.random()*1500;
      const master=audioCtx.createGain(); master.gain.value=0.11; master.connect(audioCtx.destination);
      [{mult:1.00,amp:.50,dec:.45},{mult:2.76,amp:.25,dec:.30},
       {mult:5.40,amp:.12,dec:.20},{mult:8.93,amp:.06,dec:.14}]
      .forEach(({mult,amp,dec})=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.type='sine'; o.frequency.value=fund*mult;
        g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(amp,now+0.002);
        g.gain.exponentialRampToValueAtTime(0.0001,now+dec);
        o.connect(g); g.connect(master); o.start(now); o.stop(now+dec+0.05);
      });
      const bL=Math.floor(audioCtx.sampleRate*0.018),buf=audioCtx.createBuffer(1,bL,audioCtx.sampleRate);
      const data=buf.getChannelData(0); for(let i=0;i<bL;i++) data[i]=Math.random()*2-1;
      const ns=audioCtx.createBufferSource(); ns.buffer=buf;
      const fl=audioCtx.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=fund*1.4; fl.Q.value=3;
      const ng=audioCtx.createGain(); ng.gain.setValueAtTime(0.35,now); ng.gain.exponentialRampToValueAtTime(0.0001,now+0.018);
      ns.connect(fl); fl.connect(ng); ng.connect(master); ns.start(now);
    }

    // ── PHYSICS ───────────────────────────────────────────────────
    const GRAVITY=7.0, DRAG=4.5, RESTITUTION=0.20, SUBSTEPS=2, BOUND_R=4.2;

    function physicsStep(dt) {
      const sub=dt/SUBSTEPS;
      for (let s=0; s<SUBSTEPS; s++) {
        for (const m of allMarbles) {
          if (m === active) continue; // being animated by the reveal transition instead
          const len=m.pos.length();
          if (len>0.001) m.vel.addScaledVector(m.pos,-GRAVITY*sub/len);
          const maxR=BOUND_R-m.radius;
          if (len>maxR) m.vel.addScaledVector(m.pos,-(len-maxR)*14*sub/len);
          m.vel.multiplyScalar(1-DRAG*sub);
          const spd=m.vel.length(); if(spd>9) m.vel.multiplyScalar(9/spd);
        }
        for (const m of allMarbles) { if (m !== active) m.pos.addScaledVector(m.vel,sub); }
        for (let iter=0; iter<2; iter++) { // was 3 collision iterations
          for (let i=0;i<allMarbles.length;i++) {
            for (let j=i+1;j<allMarbles.length;j++) {
              const a=allMarbles[i],b=allMarbles[j];
              if (a === active || b === active) continue;
              const dx=a.pos.x-b.pos.x,dy=a.pos.y-b.pos.y,dz=a.pos.z-b.pos.z;
              const d2=dx*dx+dy*dy+dz*dz, min=a.radius+b.radius;
              if (d2<min*min&&d2>1e-6) {
                const d=Math.sqrt(d2),inv=1/d,pen=(min-d)*0.5;
                const nx=dx*inv,ny=dy*inv,nz=dz*inv;
                a.pos.x+=nx*pen;a.pos.y+=ny*pen;a.pos.z+=nz*pen;
                b.pos.x-=nx*pen;b.pos.y-=ny*pen;b.pos.z-=nz*pen;
                const rvn=(a.vel.x-b.vel.x)*nx+(a.vel.y-b.vel.y)*ny+(a.vel.z-b.vel.z)*nz;
                if(rvn<0){const imp=-(1+RESTITUTION)*rvn*0.5;
                  a.vel.x+=imp*nx;a.vel.y+=imp*ny;a.vel.z+=imp*nz;
                  b.vel.x-=imp*nx;b.vel.y-=imp*ny;b.vel.z-=imp*nz;}
              }
            }
          }
        }
      }
      for (const m of allMarbles) { if (m !== active) m.group.position.copy(m.pos); }
    }

    // ── CURSOR WORLD POSITION (cheap — project onto near sphere) ──
    const _cursorRay = new THREE.Raycaster();
    const cursorWorld = new THREE.Vector3();
    let   cursorOnScreen = false;

    function updateCursorWorld() {
      cursorOnScreen = mouse.x > -1.9 && mouse.x < 1.9 && mouse.y > -1.9 && mouse.y < 1.9;
      if (cursorOnScreen) {
        _cursorRay.setFromCamera(mouse, camera);
        // Project onto a sphere of radius 3.5 — gives a stable world-space cursor position
        const ro = _cursorRay.ray.origin, rd = _cursorRay.ray.direction;
        const b = 2*ro.dot(rd), c = ro.dot(ro) - 12.25, disc = b*b - 4*c;
        _cursorRay.ray.at(disc >= 0 ? Math.max((-b - Math.sqrt(disc))/2, 0.5) : 4, cursorWorld);
      }
    }

    // ── RGB BEAM TRAIL — ribbon update ───────────────────────────
    function updateTrail() {
      if (!cursorOnScreen) {
        ribColArr.fill(0); // black = invisible with additive blending
        ribGeo.attributes.color.needsUpdate = true;
        trailSeeded = false;
        return;
      }

      // First appearance: seed all positions at cursor so no ghost tail from origin
      if (!trailSeeded) {
        for (let i = 0; i < TRAIL_N; i++) {
          trailPosArr[i*3]   = cursorWorld.x;
          trailPosArr[i*3+1] = cursorWorld.y;
          trailPosArr[i*3+2] = cursorWorld.z;
        }
        trailSeeded = true;
      }

      // Shift ring-buffer: oldest at 0, newest at TRAIL_N-1
      for (let i = 0; i < TRAIL_N - 1; i++) {
        trailPosArr[i*3]   = trailPosArr[(i+1)*3];
        trailPosArr[i*3+1] = trailPosArr[(i+1)*3+1];
        trailPosArr[i*3+2] = trailPosArr[(i+1)*3+2];
      }
      const h = (TRAIL_N - 1) * 3;
      trailPosArr[h]   = cursorWorld.x;
      trailPosArr[h+1] = cursorWorld.y;
      trailPosArr[h+2] = cursorWorld.z;

      // Camera axes — ribbon edges are always perpendicular to the view
      camera.getWorldDirection(_camFwd);
      _camRt.setFromMatrixColumn(camera.matrixWorld, 0);

      for (let i = 0; i < TRAIL_N; i++) {
        const t  = i / (TRAIL_N - 1);  // 0 = tail, 1 = head
        const px = trailPosArr[i*3], py = trailPosArr[i*3+1], pz = trailPosArr[i*3+2];

        // Segment direction (central difference for smooth orientation)
        const n = Math.min(i + 1, TRAIL_N - 1) * 3;
        const p = Math.max(i - 1, 0)           * 3;
        _seg.set(trailPosArr[n]-trailPosArr[p], trailPosArr[n+1]-trailPosArr[p+1], trailPosArr[n+2]-trailPosArr[p+2]);
        if (_seg.lengthSq() < 1e-8) _seg.copy(_camRt); // stationary fallback

        // Ribbon edge direction: perp to both trail direction and camera forward
        _perp.crossVectors(_seg, _camFwd).normalize();
        if (_perp.lengthSq() < 0.001) _perp.copy(_camRt);

        const halfW = t * t * BEAM_HW; // taper width: 0 at tail, BEAM_HW at head
        const vi = i * 6;
        ribPosArr[vi]   = px - _perp.x * halfW;  ribPosArr[vi+1] = py - _perp.y * halfW;  ribPosArr[vi+2] = pz - _perp.z * halfW;
        ribPosArr[vi+3] = px + _perp.x * halfW;  ribPosArr[vi+4] = py + _perp.y * halfW;  ribPosArr[vi+5] = pz + _perp.z * halfW;

        // Rainbow colour; multiply by t² to fade brightness toward tail
        const hue    = ((time * 0.35) + t * 0.6) % 1.0;
        const bright = t * t;
        _hslCol.setHSL(hue, 1.0, 0.55);
        const r = _hslCol.r * bright, g = _hslCol.g * bright, b = _hslCol.b * bright;
        ribColArr[vi]   = r; ribColArr[vi+1] = g; ribColArr[vi+2] = b;
        ribColArr[vi+3] = r; ribColArr[vi+4] = g; ribColArr[vi+5] = b;
      }

      ribGeo.attributes.position.needsUpdate = true;
      ribGeo.attributes.color.needsUpdate    = true;
    }

    // ── MOUSE & ORBIT ─────────────────────────────────────────────
    const mouse = new THREE.Vector2(-99, -99);
    window.addEventListener('mousemove', e => {
      mouse.x=(e.clientX/innerWidth)*2-1;
      mouse.y=-(e.clientY/innerHeight)*2+1;
    });

    const cam = { theta:0, phi:0.28, radius:4.8, dragging:false, lastX:0, lastY:0,
                  velTheta:0, velPhi:0, autoRotate:true, resumeTimer:null, locked:false };
    const canvas = renderer.domElement;
    canvas.addEventListener('mousedown', e => {
      if (phase !== 'idle') return; // frozen while a marble is opening/open/closing
      e.preventDefault(); cam.dragging=true; cam.autoRotate=false;
      cam.velTheta=0; cam.velPhi=0; cam.lastX=e.clientX; cam.lastY=e.clientY;
      canvas.classList.add('dragging'); clearTimeout(cam.resumeTimer);
    });
    window.addEventListener('mousemove', e => {
      if (!cam.dragging) return;
      const dx=e.clientX-cam.lastX, dy=e.clientY-cam.lastY;
      cam.velTheta=-dx*0.006; cam.velPhi=dy*0.004;

    });

      cam.dragging=false; canvas.classList.remove('dragging');

    });
    canvas.addEventListener('touchstart', e=>{
      if (phase !== 'idle') return;
      e.preventDefault(); const t=e.touches[0];
      cam.dragging=true;cam.autoRotate=false;cam.velTheta=0;cam.velPhi=0;
      cam.lastX=t.clientX;cam.lastY=t.clientY;clearTimeout(cam.resumeTimer);
    },{passive:false});
    window.addEventListener('touchmove', e=>{
      if(!cam.dragging)return; const t=e.touches[0];
      const dx=t.clientX-cam.lastX,dy=t.clientY-cam.lastY;
      cam.velTheta=-dx*0.006;cam.velPhi=dy*0.004;
      cam.theta+=cam.velTheta;cam.phi+=cam.velPhi;
      cam.phi=Math.max(-1.3,Math.min(1.3,cam.phi));
      cam.lastX=t.clientX;cam.lastY=t.clientY;
    },{passive:true});
    window.addEventListener('touchend',()=>{
      cam.dragging=false;cam.resumeTimer=setTimeout(()=>{cam.autoRotate=true;},2500);
    });

    // ── HOVER RAYCASTER ───────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const _v     = new THREE.Vector3();
    const _toCam = new THREE.Vector3();
    // Cache to avoid allocating a new array every frame
    const outerMeshes = allMarbles.map(m => m.outer);

    // ── CASE STUDY REVEAL ────────────────────────────────────────────
    // Clicking a portfolio marble: it grows and floats out of the cluster
    // toward a frozen camera, its glass shell dissolves in a burst of
    // light revealing the image inside, then the page (not a popup —
    // an in-flow section already sitting below the fold) is smooth-
    // scrolled into view. Closing reverses all of it and hands the
    // marble back to the physics sim, which pulls it back into the pile.
    const PLACEHOLDER_DESC = "This is a placeholder case study. Swap this text for the real project write-up — what the project was, the problem it solved, your role, and the outcome — plus a link to the live project if there is one.";
    const CASE_COPY = {}; // e.g. CASE_COPY['Web Design'] = { desc: '...' } to override the placeholder

    const LAUNCH_S = 0.62, BREAK_S = 0.30, CLOSE_S = 0.55;
    const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;

    let phase = 'idle'; // idle | launch | break | open | close
    let active = null;
    let phaseStart = 0;
    const launchTarget = new THREE.Vector3();
    const launchStart   = new THREE.Vector3();

    // One-shot flash ring at the moment the shell breaks
    const burstMat  = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0, side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false });
    const burstMesh = new THREE.Mesh(new THREE.RingGeometry(0.86, 1, 48), burstMat);
    burstMesh.visible = false;
    scene.add(burstMesh);

    const csIndex     = document.getElementById('cs-index');
    const csCategory  = document.getElementById('cs-category');
    const csTitle     = document.getElementById('cs-title');
    const csDesc      = document.getElementById('cs-desc');

    // Character-scramble "decode" reveal — cycles random glyphs, settling
    // left-to-right into the real text, then a quick RGB-split glitch flick.
    const SCRAMBLE_CHARS = '!<>-_\\/[]{}=+*^?#$%01';
    function scrambleInto(el, finalText, duration = 850) {
      const startT = performance.now();
      const n = finalText.length;
      el.classList.remove('glitch-flicker');
      function frame(now) {
        const t = Math.min((now - startT) / duration, 1);
        let out = '';
        for (let i = 0; i < n; i++) {
          const ch = finalText[i];
          const revealAt = (i / n) * 0.7; // stagger settle left-to-right
          if (ch === ' ' || ch === '/' || t > revealAt + 0.22) out += ch;
          else out += SCRAMBLE_CHARS[(Math.random() * SCRAMBLE_CHARS.length) | 0];
        }
        el.textContent = out;
        if (t < 1) requestAnimationFrame(frame);
        else {
          el.textContent = finalText;
          void el.offsetWidth; // restart the animation if already applied once
          el.classList.add('glitch-flicker');
          setTimeout(() => el.classList.remove('glitch-flicker'), 420);
        }
      }
      requestAnimationFrame(frame);
    }
    scrambleInto(document.getElementById('logo-mark'), 'RC', 700); // decode-in on load

    function startOpen(m) {
      if (phase !== 'idle') return;
      active = m; phase = 'launch'; phaseStart = time;
      launchStart.copy(m.pos);
      cam.locked = true; cam.dragging = false; cam.autoRotate = false;
      cam.velTheta = 0; cam.velPhi = 0;
      clearTimeout(cam.resumeTimer);
      canvas.classList.remove('dragging');
      const fwd = new THREE.Vector3();
      camera.getWorldDirection(fwd);
      launchTarget.copy(camera.position).addScaledVector(fwd, 3.1);
    }
    function startClose() {
      if (phase !== 'open') return;
      phase = 'close'; phaseStart = time;
      document.body.classList.remove('expanded');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    document.getElementById('back-btn').addEventListener('click', startClose);
    window.addEventListener('keydown', e => { if (e.key === 'Escape') startClose(); });

    function updateTransition() {
      if (phase === 'idle' || !active) return;
      const m = active;
      const el = time - phaseStart;

      if (phase === 'launch') {
        const t = Math.min(el / LAUNCH_S, 1);
        const e = easeInOut(t);
        m.pos.lerpVectors(launchStart, launchTarget, e);
        m.vel.set(0, 0, 0);
        m.group.position.copy(m.pos);
        m.group.scale.setScalar(1 + e * 1.4); // grow to 2.4x
        if (t >= 1) {
          phase = 'break'; phaseStart = time;
          burstMesh.position.copy(m.pos);
          burstMesh.scale.setScalar(m.radius * 1.4);
          burstMesh.visible = true;
          burstMat.opacity = 1;
        }
        return;
      }

      if (phase === 'break' || phase === 'close') {
        const t = Math.min(el / (phase === 'break' ? BREAK_S : CLOSE_S), 1);
        const k = phase === 'break' ? t : 1 - t; // k: 0=whole shell, 1=broken open
        m.outer.material.opacity = 1 - k;
        m.outer.material.clearcoat = 0.4 * (1 - k);
        m.innerGroup.scale.setScalar(1 - k);
        if (m.imagePlane) m.imagePlane.material.opacity = 0.72 + 0.28 * k;

        if (phase === 'break') {
          burstMesh.quaternion.copy(camera.quaternion);
          burstMesh.scale.setScalar(m.radius * (1.4 + t * 2.4));
          burstMat.opacity = 1 - t;
          if (t >= 1) {
            burstMesh.visible = false;
            phase = 'open';
            const idx = PORTFOLIO.findIndex(p => p.label === m.label) + 1;
            csIndex.textContent = String(idx).padStart(2, '0');
            scrambleInto(csCategory, `${String(idx).padStart(2,'0')} // ${m.label.toUpperCase()}`, 500);
            scrambleInto(csTitle, m.label.toUpperCase(), 900);
            csDesc.textContent = (CASE_COPY[m.label] && CASE_COPY[m.label].desc) || PLACEHOLDER_DESC;
            document.body.classList.add('expanded');
            requestAnimationFrame(() => window.scrollTo({ top: innerHeight, behavior: 'smooth' }));
          }
        } else if (t >= 1) {
          m.scaleCurrent = m.group.scale.x; // let the normal hover lerp ease it back to 1
          m.vel.set((Math.random()-0.5)*0.6, 0.25, (Math.random()-0.5)*0.6);
          phase = 'idle'; active = null; cam.locked = false;
          cam.resumeTimer = setTimeout(() => { cam.autoRotate = true; }, 1200);
        }
        return;
      }
      // phase === 'open': hold steady, nothing to animate
    }

    // Click (not drag) on a portfolio marble starts the reveal.
    let downX = 0, downY = 0;
    canvas.addEventListener('mousedown', e => { downX = e.clientX; downY = e.clientY; });
    canvas.addEventListener('mouseup', e => {
      if (phase !== 'idle') return;
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; // was a drag
      raycaster.setFromCamera(mouse, camera);
      const hit = raycaster.intersectObjects(outerMeshes)[0]?.object;
      const m = allMarbles.find(mm => mm.outer === hit);
      if (m && m.isPortfolio) startOpen(m);
    });
    let downTX = 0, downTY = 0;
    canvas.addEventListener('touchstart', e => {
      const t = e.touches[0]; downTX = t.clientX; downTY = t.clientY;
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
      if (phase !== 'idle') return;
      const t = e.changedTouches[0];
      if (Math.hypot(t.clientX - downTX, t.clientY - downTY) > 8) return; // was a drag
      raycaster.setFromCamera(mouse, camera);
      const hit = raycaster.intersectObjects(outerMeshes)[0]?.object;
      const m = allMarbles.find(mm => mm.outer === hit);
      if (m && m.isPortfolio) startOpen(m);
    });

    // ── MAIN LOOP — capped at 24 fps ──────────────────────────────
    const FRAME_MS = 1000 / 24;
    let prevFrameTime = 0;
    let time = 0;

    function animate(now) {
      requestAnimationFrame(animate);
      if (now - prevFrameTime < FRAME_MS) return;
      const dt = Math.min((now - prevFrameTime) / 1000, 0.05);
      prevFrameTime = now;
      time += dt;

      physicsStep(dt);
      updateTransition();

      // Slowly rotate swirl backdrops on all marbles
      for (const m of allMarbles) {
        if (m === active) continue;
        m.innerGroup.rotation.y += dt * 0.05;
      }

      // Hover — reuse cached array, no allocation
      raycaster.setFromCamera(mouse, camera);
      const hitObj = (cam.dragging || phase !== 'idle')
        ? null
        : raycaster.intersectObjects(outerMeshes)[0]?.object ?? null;

      for (const m of allMarbles) {
        if (m === active) continue; // scale/position owned by the reveal transition
        m.hovered = m.outer === hitObj;
        if (m.hovered && !m.wasHovered) {
          playGlassClink();
          const dir = m.pos.clone().normalize();
          if (dir.lengthSq() < 0.001) dir.set(0,1,0);
          m.vel.addScaledVector(dir, 2.0);
        }
        m.wasHovered = m.hovered;
        m.scaleTarget  = m.hovered ? 1.14 : 1.0;
        m.scaleCurrent += (m.scaleTarget - m.scaleCurrent) * 0.12;
        m.group.scale.setScalar(m.scaleCurrent);
      }
      canvas.style.cursor = (!cam.dragging && phase === 'idle' && allMarbles.some(m => m.hovered && m.isPortfolio)) ? 'pointer' : '';

      // Cursor world position + RGB trail
      updateCursorWorld();
      updateTrail();

      // Camera — frozen while the reveal transition owns it
      if (!cam.locked) {
        if (cam.autoRotate) {
          cam.theta+=dt*0.045; cam.phi=0.28*Math.sin(time*0.17);
        } else if (!cam.dragging) {
          cam.velTheta*=0.88; cam.velPhi*=0.88;
          cam.theta+=cam.velTheta; cam.phi+=cam.velPhi;
          cam.phi=Math.max(-1.3,Math.min(1.3,cam.phi));
        }
        camera.position.x=cam.radius*Math.cos(cam.phi)*Math.sin(cam.theta);
        camera.position.y=cam.radius*Math.sin(cam.phi);
        camera.position.z=cam.radius*Math.cos(cam.phi)*Math.cos(cam.theta);
        camera.lookAt(0,0,0);
      }

      // Lights are fixed — no per-frame orbit math

      // Reposition each image plane just inside the marble's front face toward camera.
      // Own swirl sphere (slightly behind it) passes depth test.
      // A farther marble's opaque swirl sphere correctly blocks it.
      for (const m of portfolioMarbles) {
        if (!m.imagePlane) continue;
        _toCam.subVectors(camera.position, m.pos).normalize();
        m.imagePlane.position.copy(_toCam).multiplyScalar(m.radius * 0.84);
        m.imagePlane.quaternion.copy(camera.quaternion);
      }

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', ()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
