<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Test — Robert Capron</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #08080e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 24px;
      font-family: 'Space Mono', monospace;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 48px;
    }
    .frame {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 124px;
    }
    .frame .block {
      background: #d9d9d9;
      width: 521px;
      height: 463px;
      flex-shrink: 0;
      max-width: 100%;
    }
  </style>
</head>
<body>
  <h1>Figma Design Test</h1>
  <div class="frame">
    <div class="block"></div>
    <div class="block"></div>
  </div>
</body>
</html>
